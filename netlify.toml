[build]
  base = "client"
  command = "npm run build"
  publish = "client/dist"

# Assets con hash de contenido (Vite): pueden cachearse para siempre, un
# cambio de contenido siempre genera un nombre de archivo distinto.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Videos e imágenes servidos desde public/: no tienen hash en el nombre,
# se usa una TTL larga pero no infinita.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# index.html: siempre revalidar para que un deploy nuevo se vea al toque.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
